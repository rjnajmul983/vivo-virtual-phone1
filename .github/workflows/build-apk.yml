name: Build Vivo V2507A Virtual Container APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Clean Android Project
        run: |
          echo "" | tr -d ' \t\r\n' | base64 -d | python3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ensure Android SDK Platform 34
        run: |
          set +e
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            export ANDROID_HOME="$HOME/android-sdk"
          fi
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKM" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdtools.zip
            unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -f cmdtools.zip
          fi
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null 2>&1
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -e

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Persistent Signing Key
        run: |
          mkdir -p app/keystore
          if [ ! -f app/keystore/vcontainer_consistent.jks ]; then
            keytool -genkeypair -v -keystore app/keystore/vcontainer_consistent.jks -keyalg RSA -keysize 2048 -validity 10000 -alias vcontainer_key -storepass vivo2507a -keypass vivo2507a -dname "CN=VivoVirtualContainer, OU=MobileDev, O=VContainer, L=Dhaka, S=Dhaka, C=BD"
          fi

      - name: Build Debug & Signed Release APK
        run: |
          gradle assembleDebug assembleRelease --stacktrace

      - name: Upload Compiled APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VivoVirtualContainer-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
